<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学习笔记 · 选择文档站</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7fb; --fg: #172033; --muted: #5d6b82; --card: #fff; --line: #dde3ee; --brand: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #10151f; --fg: #eef3ff; --muted: #a7b3c8; --card: #171e2b; --line: #2a3547; --brand: #7aa2ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(880px, calc(100% - 40px)); padding: 48px 0; }
    h1 { margin: 0 0 8px; font-size: clamp(30px, 6vw, 48px); letter-spacing: -0.03em; }
    p { margin: 0 0 32px; color: var(--muted); }
    .cards { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    a.card { display: block; padding: 26px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: inherit; text-decoration: none; transition: transform .15s, border-color .15s; }
    a.card:hover { transform: translateY(-2px); border-color: var(--brand); }
    .tag { color: var(--brand); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    h2 { margin: 8px 0 8px; font-size: 24px; }
    .desc { margin: 0; color: var(--muted); font-size: 15px; }
    footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>学习笔记</h1>
    <p>同一份内容，两种文档站。选择你要进入的版本：</p>
    <div class="cards">
      <a class="card" href="vitepress/">
        <div class="tag">VitePress</div>
        <h2>VitePress 版</h2>
        <p class="desc">Vue 驱动、全文搜索、可交互示例与源码查看。</p>
      </a>
      <a class="card" href="astro/">
        <div class="tag">Astro</div>
        <h2>Astro 版</h2>
        <p class="desc">Astro + Starlight 渲染，与 VitePress 共用 content/。</p>
      </a>
    </div>
    <footer>内容源：content/ · 部署：GitHub Pages</footer>
  </main>
</body>
</html>
